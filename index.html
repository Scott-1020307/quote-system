<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>室內裝修報價與工程進度管理系統</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    :root { --primary: #2c3e50; --secondary: #27ae60; --light-bg: #f8f9fa; --border: #dee2e6; }
    body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 20px; background-color: #f4f6f8; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1, h3, h4 { color: #2c3e50; margin-top: 5px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #dee2e6; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    button { cursor: pointer; padding: 10px 18px; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; }
    .btn-primary { background: #2c3e50; color: #fff; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-warning { background: #f39c12; color: #fff; }
    .btn-info { background: #2980b9; color: #fff; }
    .btn-purple { background: #8e44ad; color: #fff; }
    .btn-danger { background: #e74c3c; color: #fff; padding: 6px 12px; }
    .mode-btn { background: #e2e8f0; color: #475569; font-size: 15px; padding: 10px 20px; border-radius: 6px; border: 2px solid transparent; transition: all 0.2s; }
    .mode-btn.active { background: #2c3e50; color: #fff; border-color: #1e293b; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; font-size: 14px; }
    th { background: #f8f9fa; color: #2c3e50; }
    .cost-col { background: #fff8e7; display: none; }
    .show-cost .cost-col { display: table-cell; }
    .summary-box { background: #eef2f5; padding: 15px; border-radius: 6px; margin-top: 15px; }
    .summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }
    .summary-row.total { font-size: 18px; font-weight: bold; color: #c0392b; border-top: 2px solid #ccc; padding-top: 10px; }
    .admin-panel { background: #eef7ee; border: 1px dashed #27ae60; padding: 15px; border-radius: 6px; margin-top: 15px; display: none; }
    .payment-box { background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; margin-top: 10px; font-size: 13px; }
    .schedule-preview { background: #fffbe6; border: 1px solid #ffe58f; padding: 15px; border-radius: 6px; margin-top: 15px; }
    
    .test-page-panel { background: #f3e8ff; border: 2px solid #a855f7; border-radius: 8px; padding: 20px; margin-bottom: 20px; display: none; }

    #pdfPrintArea { display: none; }
    @media print {
      body * { visibility: hidden; }
      #pdfPrintArea, #pdfPrintArea * { visibility: visible; }
      #pdfPrintArea {
        display: block !important;
        position: absolute;
        left: 0; top: 0; width: 100%;
        background: #fff; padding: 15px; color: #000;
      }
      .page-break { page-break-after: always; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body>

<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <h1>🏢 室內裝修報價與工程進度管理系統</h1>
    <div style="display: flex; gap: 6px;">
      <button class="btn-purple" onclick="toggleTestPage()">🧪 測試頁</button>
      <button class="btn-warning" onclick="toggleAdminPanel()">⚙ 新增常用選單</button>
      <button class="btn-primary" onclick="toggleCostDisplay()">🔒 切換成本/毛利</button>
    </div>
  </div>

  <div class="test-page-panel" id="testPagePanel">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #c084fc; padding-bottom: 10px; margin-bottom: 15px;">
      <h3 style="margin: 0; color: #6b21a8;">🧪 系統開發測試頁 (Test Mode)</h3>
      <button class="btn-danger" onclick="toggleTestPage()" style="padding: 4px 10px; font-size: 12px;">✕ 關閉測試頁</button>
    </div>
    
    <div class="grid-2">
      <div>
        <h4 style="margin-top:0; color:#581c87;">⚡ 一鍵自動帶入測試模擬資料</h4>
        <div style="display: flex; gap: 10px;">
          <button class="btn-purple" onclick="loadTestData()">🚀 自動帶入完整測試資料</button>
          <button class="btn-warning" onclick="clearAllItemsData()">🗑 清空目前所有項目</button>
