<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>室內裝修報價與工程進度管理系統</title>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f3f4f6;
    font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;
    color: #222;
}

.container {
    max-width: 1400px;
    margin: auto;
}

h1 {
    margin: 0 0 20px;
    font-size: 28px;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.card h2 {
    margin-top: 0;
    font-size: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.field label {
    font-weight: bold;
}

input,
select,
textarea,
button {
    font-family: inherit;
}

input,
select,
textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 70px;
    resize: vertical;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    opacity: .85;
}

.btn {
    background: #333;
    color: white;
}

.btn-green {
    background: #238636;
    color: white;
}

.btn-blue {
    background: #2563eb;
    color: white;
}

.btn-red {
    background: #dc2626;
    color: white;
}

.btn-gray {
    background: #e5e7eb;
    color: #222;
}

.button-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.category-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.category-buttons button {
    background: #eee;
}

.category-buttons button.active {
    background: #222;
    color: white;
}

.quote-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

.quote-table th,
.quote-table td {
    border: 1px solid #ddd;
    padding: 8px;
    vertical-align: middle;
}

.quote-table th {
    background: #f0f0f0;
}

.right {
    text-align: right;
}

.center {
    text-align: center;
}

.summary {
    display: flex;
    justify-content: flex-end;
}

.summary-box {
    width: 400px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #ddd;
}

.summary-row.total {
    font-size: 20px;
    font-weight: bold;
}

.checkbox-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.checkbox-row label {
    display: flex;
    align-items: center;
    gap: 5px;
}

.checkbox-row input {
    width: auto;
}

.test-panel {
    display: none;
    background: #fff7ed;
    border: 1px solid #fdba74;
}

.test-panel.show {
    display: block;
}

.notice {
    padding: 12px;
    border-radius: 8px;
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    margin-top: 10px;
}

@media (max-width: 900px) {

    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .summary-box {
        width: 100%;
    }

}

</style>

</head>


<body>

<div class="container">

<h1>
    室內裝修報價與工程進度管理系統
</h1>


<!-- ==========================================================
     功能按鈕
========================================================== -->

<div class="card">

    <div class="button-row">

        <button
            class="btn-gray"
            onclick="toggleTestPage()">
            測試資料
        </button>

        <button
            class="btn-blue"
            onclick="saveDraft()">
            儲存草稿
        </button>

        <button
            class="btn-gray"
            onclick="loadDraft()">
            載入草稿
        </button>

        <button
            class="btn-red"
            onclick="clearAllItemsData()">
            清除報價
        </button>

    </div>

</div>


<!-- ==========================================================
     測試資料
========================================================== -->

<div
    id="testPanel"
    class="card test-panel">

    <h2>測試資料</h2>

    <div class="button-row">

        <button
            class="btn-blue"
            onclick="loadTestData()">
            載入測試資料
        </button>

        <button
            class="btn-red"
            onclick="clearAllItemsData()">
            清除全部
        </button>

    </div>

    <div
        id="testMonitor"
        class="notice">
        目前尚無資料
    </div>

</div>


<!-- ==========================================================
     基本資料
========================================================== -->

<div class="card">

    <h2>基本資料</h2>

    <div class="grid">

        <div class="field">
            <label>客戶名稱</label>
            <input
                id="clientName"
                type="text">
        </div>

        <div class="field">
            <label>工程地點</label>
            <input
                id="projectLocation"
                type="text">
        </div>

        <div class="field">
            <label>合約編號</label>
            <input
                id="contractNo"
                type="text">
        </div>

        <div class="field">
            <label>報價日期</label>
            <input
                id="quoteDate"
                type="date">
        </div>

        <div class="field">
            <label>開工日期</label>
            <input
                id="startDate"
                type="date">
        </div>

        <div class="field">
            <label>設計師</label>
            <input
                id="designerName"
                type="text">
        </div>

    </div>

</div>


<!-- ==========================================================
     裝修類型
========================================================== -->

<div class="card">

    <h2>裝修類型</h2>

    <div class="category-buttons">

        <button
            onclick="selectSiteType(this,'簡易局部裝修')">
            簡易局部裝修
        </button>

        <button
            onclick="selectSiteType(this,'新成屋標準裝修')">
            新成屋標準裝修
        </button>

        <button
            onclick="selectSiteType(this,'老屋翻新')">
            老屋翻新
        </button>

        <button
            onclick="selectSiteType(this,'毛胚屋')">
            毛胚屋
        </button>

    </div>

    <div
        id="siteTypeDisplay"
        class="notice">
        尚未選擇
    </div>

</div>


<!-- ==========================================================
     新增報價
========================================================== -->

<div class="card">

    <h2>新增報價項目</h2>

    <div class="grid">

        <div class="field">

            <label>工程分類</label>

            <select id="categorySelect">

                <option value="">
                    請選擇
                </option>

                <option value="水電工程">
                    水電工程
                </option>

                <option value="燈具工程">
                    燈具工程
                </option>

                <option value="木作工程">
                    木作工程
                </option>

                <option value="油漆工程">
                    油漆工程
                </option>

                <option value="雜項工程">
                    雜項工程
                </option>

                <option value="保護工程">
                    保護工程
                </option>

                <option value="拆除工程">
                    拆除工程
                </option>

                <option value="泥作工程">
                    泥作工程
                </option>

                <option value="玻璃工程">
                    玻璃工程
                </option>

                <option value="木地板工程">
                    木地板工程
                </option>

            </select>

        </div>


        <div class="field">

            <label>工程項目</label>

            <input
                id="subCategorySelect"
                type="text">

        </div>


        <div class="field">

            <label>數量</label>

            <input
                id="itemQty"
                type="number"
                step="0.01"
                value="1">

        </div>


        <div class="field">

            <label>單位</label>

            <input
                id="itemUnit"
                type="text"
                value="式">

        </div>


        <div class="field">

            <label>成本單價</label>

            <input
                id="costPrice"
                type="number"
                step="1">

        </div>


        <div class="field">

            <label>報價單價</label>

            <input
                id="quotePrice"
                type="number"
                step="1">

        </div>


        <div class="field">

            <label>備註</label>

            <input
                id="itemNote"
                type="text">

        </div>

    </div>


    <div class="button-row">

        <button
            class="btn-green"
            onclick="addItem()">
            加入報價
        </button>

    </div>

</div>


<!-- ==========================================================
     報價明細
========================================================== -->

<div class="card">

    <h2>報價明細</h2>

    <div style="overflow-x:auto;">

        <table class="quote-table">

            <thead>

                <tr>

                    <th>工種</th>
                    <th>項目</th>
                    <th>數量</th>
                    <th>單位</th>
                    <th>成本</th>
                    <th>報價單價</th>
                    <th>複價</th>
                    <th>備註</th>
                    <th>操作</th>

                </tr>

            </thead>

            <tbody id="quoteTableBody">
            </tbody>

        </table>

    </div>

</div>


<!-- ==========================================================
     費用設定
========================================================== -->

<div class="card">

    <h2>費用設定</h2>

    <div class="checkbox-row">

        <label>

            <input
                type="checkbox"
                id="chkManagementFee"
                checked
                onchange="renderSummary()">

            管理費 10%

        </label>


        <label>

            <input
                type="checkbox"
                id="chkTax"
                onchange="renderSummary()">

            稅金 5%

        </label>


        <label>

            <input
                type="checkbox"
                id="chkShowPayment"
                checked>

            顯示付款方式

        </label>

    </div>

</div>


<!-- ==========================================================
     備註
========================================================== -->

<div class="card">

    <h2>備註</h2>

    <textarea
        id="presetNotes"
        placeholder="可輸入報價單備註">
    </textarea>

</div>


<!-- ==========================================================
     報價總計
========================================================== -->

<div class="card">

    <h2>報價總計</h2>

    <div class="summary">

        <div class="summary-box">

            <div class="summary-row">
                <span>工程小計</span>
                <strong id="summarySubtotal">0</strong>
            </div>

            <div class="summary-row">
                <span>管理費</span>
                <strong id="summaryManagement">0</strong>
            </div>

            <div class="summary-row">
                <span>稅金</span>
                <strong id="summaryTax">0</strong>
            </div>

            <div class="summary-row total">
                <span>工程總價</span>
                <strong id="summaryGrandTotal">0</strong>
            </div>

        </div>

    </div>

</div>


<!-- ==========================================================
     工程進度
========================================================== -->

<div class="card">

    <h2>工程進度預覽</h2>

    <div
        id="schedulePreview"
        class="notice">
        尚無工程資料
    </div>

</div>


<!-- ==========================================================
     Excel
========================================================== -->

<div class="card">

    <h2>Excel 套印</h2>

    <div class="notice">

        Excel 範本檔案名稱必須為
        <strong>template.xlsx</strong>
        ，並且與本 HTML 放在同一個資料夾。

    </div>

    <div class="button-row">

        <button
            class="btn-green"
            onclick="exportQuoteToExcel()">

            套印匯出 Excel

        </button>

    </div>

</div>

</div>


<script>


// ==========================================================
// 全域
// ==========================================================

let currentItems = [];

let selectedSiteType = '';


// ==========================================================
// 頁面載入
// ==========================================================

window.onload = function() {

    const today =
        new Date()
        .toISOString()
        .split('T')[0];

    document.getElementById(
        'quoteDate'
    ).value = today;

    updateTestMonitor();
    renderQuoteTable();
    renderSummary();
    renderSchedule();

};


// ==========================================================
// 裝修類型
// ==========================================================

function selectSiteType(button, type) {

    selectedSiteType = type;

    document
        .querySelectorAll(
            '.category-buttons button'
        )
        .forEach(btn => {

            btn.classList.remove(
                'active'
            );

        });

    button.classList.add(
        'active'
    );

    document.getElementById(
        'siteTypeDisplay'
    ).innerText =
        `目前選擇：${type}`;

}


// ==========================================================
// 測試面板
// ==========================================================

function toggleTestPage() {

    document
        .getElementById(
            'testPanel'
        )
        .classList.toggle(
            'show'
        );

}


// ==========================================================
// 測試資料
// ==========================================================

function loadTestData() {

    document.getElementById(
        'clientName'
    ).value =
        '劉隆穎';

    document.getElementById(
        'projectLocation'
    ).value =
        '桃園市中壢區高鐵站前路426號5樓';

    document.getElementById(
        'contractNo'
    ).value =
        '007006';

    document.getElementById(
        'designerName'
    ).value =
        '陳昭宇 設計師';


    currentItems = [

        {
            category: '水電工程',
            name: '新增插座',
            qty: 8,
            unit: '處',
            costPrice: 800,
            price: 1500,
            priceSubtotal: 12000,
            note: ''
        },

        {
            category: '水電工程',
            name: '新增開關',
            qty: 5,
            unit: '處',
            costPrice: 600,
            price: 1200,
            priceSubtotal: 6000,
            note: ''
        },

        {
            category: '水電工程',
            name: '網路線路配置',
            qty: 1,
            unit: '式',
            costPrice: 8000,
            price: 15000,
            priceSubtotal: 15000,
            note: ''
        },

        {
            category: '木作工程',
            name: '平釘天花板',
            qty: 20,
            unit: '坪',
            costPrice: 3200,
            price: 5000,
            priceSubtotal: 100000,
            note: ''
        },

        {
            category: '木作工程',
            name: '窗簾盒',
            qty: 3,
            unit: '座',
            costPrice: 2500,
            price: 4500,
            priceSubtotal: 13500,
            note: ''
        },

        {
            category: '木作工程',
            name: '電視牆造型',
            qty: 1,
            unit: '式',
            costPrice: 18000,
            price: 32000,
            priceSubtotal: 32000,
            note: ''
        },

        {
            category: '油漆工程',
            name: '牆面乳膠漆',
            qty: 80,
            unit: '坪',
            costPrice: 700,
            price: 1100,
            priceSubtotal: 88000,
            note: ''
        },

        {
            category: '燈具工程',
            name: '吸頂燈安裝',
            qty: 6,
            unit: '盞',
            costPrice: 500,
            price: 1000,
            priceSubtotal: 6000,
            note: ''
        },

        {
            category: '燈具工程',
            name: '間接照明',
            qty: 15,
            unit: '尺',
            costPrice: 500,
            price: 900,
            priceSubtotal: 13500,
            note: ''
        },

        {
            category: '雜項工程',
            name: '清潔工程',
            qty: 1,
            unit: '式',
            costPrice: 5000,
            price: 8000,
            priceSubtotal: 8000,
            note: ''
        }

    ];


    renderQuoteTable();
    renderSummary();
    renderSchedule();
    updateTestMonitor();

}


// ==========================================================
// 清除
// ==========================================================

function clearAllItemsData() {

    if (
        !confirm(
            '確定要清除目前所有報價項目嗎？'
        )
    ) {
        return;
    }

    currentItems = [];

    renderQuoteTable();
    renderSummary();
    renderSchedule();
    updateTestMonitor();

}


// ==========================================================
// 新增
// ==========================================================

function addItem() {

    const category =
        document.getElementById(
            'categorySelect'
        ).value;

    const name =
        document.getElementById(
            'subCategorySelect'
        ).value.trim();

    const qty =
        Number(
            document.getElementById(
                'itemQty'
            ).value
        );

    const unit =
        document.getElementById(
            'itemUnit'
        ).value.trim();

    const costPrice =
        Number(
            document.getElementById(
                'costPrice'
            ).value
        );

    const price =
        Number(
            document.getElementById(
                'quotePrice'
            ).value
        );

    const note =
        document.getElementById(
            'itemNote'
        ).value.trim();


    if (!category) {

        alert(
            '請選擇工程分類'
        );

        return;
    }


    if (!name) {

        alert(
            '請輸入工程項目'
        );

        return;
    }


    if (!qty || qty <= 0) {

        alert(
            '請輸入正確數量'
        );

        return;
    }


    if (!unit) {

        alert(
            '請輸入單位'
        );

        return;
    }


    if (!price || price < 0) {

        alert(
            '請輸入報價單價'
        );

        return;
    }


    const priceSubtotal =
        Math.round(
            qty * price
        );


    currentItems.push({

        category,
        name,
        qty,
        unit,
        costPrice,
        price,
        priceSubtotal,
        note

    });


    renderQuoteTable();
    renderSummary();
    renderSchedule();
    updateTestMonitor();


    document.getElementById(
        'subCategorySelect'
    ).value = '';

    document.getElementById(
        'itemQty'
    ).value = 1;

    document.getElementById(
        'itemUnit'
    ).value = '式';

    document.getElementById(
        'costPrice'
    ).value = '';

    document.getElementById(
        'quotePrice'
    ).value = '';

    document.getElementById(
        'itemNote'
    ).value = '';

}


// ==========================================================
// 刪除
// ==========================================================

function removeItem(index) {

    currentItems.splice(
        index,
        1
    );

    renderQuoteTable();
    renderSummary();
    renderSchedule();
    updateTestMonitor();

}


// ==========================================================
// 報價表
// ==========================================================

function renderQuoteTable() {

    const tbody =
        document.getElementById(
            'quoteTableBody'
        );

    tbody.innerHTML = '';


    currentItems.forEach(
        (item, index) => {

            const tr =
                document.createElement(
                    'tr'
                );


            tr.innerHTML = `

                <td>
                    ${escapeHtml(item.category)}
                </td>

                <td>
                    ${escapeHtml(item.name)}
                </td>

                <td class="center">
                    ${item.qty}
                </td>

                <td class="center">
                    ${escapeHtml(item.unit)}
                </td>

                <td class="right">
                    ${formatMoney(item.costPrice)}
                </td>

                <td class="right">
                    ${formatMoney(item.price)}
                </td>

                <td class="right">
                    ${formatMoney(item.priceSubtotal)}
                </td>

                <td>
                    ${escapeHtml(item.note || '')}
                </td>

                <td class="center">

                    <button
                        class="btn-red"
                        onclick="removeItem(${index})">

                        刪除

                    </button>

                </td>

            `;


            tbody.appendChild(tr);

        }
    );

}


// ==========================================================
// HTML
// ==========================================================

function escapeHtml(value) {

    return String(
        value ?? ''
    )
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


// ==========================================================
// 金額
// ==========================================================

function formatMoney(value) {

    return Number(
        value || 0
    ).toLocaleString(
        'zh-TW'
    );

}


// ==========================================================
// 計算
// ==========================================================

function calculateTotals() {

    const subtotal =
        currentItems.reduce(
            (sum, item) =>
                sum +
                Number(
                    item.priceSubtotal || 0
                ),
            0
        );


    const hasMgmt =
        document.getElementById(
            'chkManagementFee'
        ).checked;


    const hasTax =
        document.getElementById(
            'chkTax'
        ).checked;


    const managementFee =
        hasMgmt
            ? Math.round(
                subtotal * 0.1
            )
            : 0;


    const subtotalWithManagement =
        subtotal +
        managementFee;


    const tax =
        hasTax
            ? Math.round(
                subtotalWithManagement *
                0.05
            )
            : 0;


    const grandTotal =
        subtotalWithManagement +
        tax;


    return {

        subtotal,
        managementFee,
        tax,
        grandTotal

    };

}


// ==========================================================
// 總計
// ==========================================================

function renderSummary() {

    const totals =
        calculateTotals();


    document.getElementById(
        'summarySubtotal'
    ).innerText =
        formatMoney(
            totals.subtotal
        );


    document.getElementById(
        'summaryManagement'
    ).innerText =
        formatMoney(
            totals.managementFee
        );


    document.getElementById(
        'summaryTax'
    ).innerText =
        formatMoney(
            totals.tax
        );


    document.getElementById(
        'summaryGrandTotal'
    ).innerText =
        formatMoney(
            totals.grandTotal
        );

}


// ==========================================================
// 工程進度
// ==========================================================

function renderSchedule() {

    const box =
        document.getElementById(
            'schedulePreview'
        );


    if (
        currentItems.length === 0
    ) {

        box.innerText =
            '尚無工程資料';

        return;
    }


    const categories =
        [
            ...new Set(
                currentItems.map(
                    item =>
                        item.category
                )
            )
        ];


    box.innerHTML =
        categories
            .map(
                (cat, index) =>
                    `${index + 1}. ${escapeHtml(cat)}`
            )
            .join('<br>');

}


// ==========================================================
// 儲存
// ==========================================================

function saveDraft() {

    const data = {

        clientName:
            document.getElementById(
                'clientName'
            ).value,

        projectLocation:
            document.getElementById(
                'projectLocation'
            ).value,

        contractNo:
            document.getElementById(
                'contractNo'
            ).value,

        quoteDate:
            document.getElementById(
                'quoteDate'
            ).value,

        startDate:
            document.getElementById(
                'startDate'
            ).value,

        designerName:
            document.getElementById(
                'designerName'
            ).value,

        presetNotes:
            document.getElementById(
                'presetNotes'
            ).value,

        currentItems

    };


    localStorage.setItem(
        'renovationQuoteDraft',
        JSON.stringify(data)
    );


    alert(
        '草稿已儲存'
    );

}


// ==========================================================
// 載入
// ==========================================================

function loadDraft() {

    const raw =
        localStorage.getItem(
            'renovationQuoteDraft'
        );


    if (!raw) {

        alert(
            '目前沒有草稿'
        );

        return;
    }


    const data =
        JSON.parse(raw);


    document.getElementById(
        'clientName'
    ).value =
        data.clientName || '';


    document.getElementById(
        'projectLocation'
    ).value =
        data.projectLocation || '';


    document.getElementById(
        'contractNo'
    ).value =
        data.contractNo || '';


    document.getElementById(
        'quoteDate'
    ).value =
        data.quoteDate || '';


    document.getElementById(
        'startDate'
    ).value =
        data.startDate || '';


    document.getElementById(
        'designerName'
    ).value =
        data.designerName || '';


    document.getElementById(
        'presetNotes'
    ).value =
        data.presetNotes || '';


    currentItems =
        data.currentItems || [];


    renderQuoteTable();
    renderSummary();
    renderSchedule();
    updateTestMonitor();


    alert(
        '草稿已載入'
    );

}


// ==========================================================
// 測試監控
// ==========================================================

function updateTestMonitor() {

    const box =
        document.getElementById(
            'testMonitor'
        );


    if (!box) {
        return;
    }


    if (
        currentItems.length === 0
    ) {

        box.innerText =
            '目前尚無報價資料';

        return;
    }


    const totals =
        calculateTotals();


    box.innerHTML = `

        報價項目：
        <strong>
            ${currentItems.length}
        </strong>
        項

        <br>

        工程小計：
        <strong>
            ${formatMoney(totals.subtotal)}
        </strong>

        <br>

        工程總價：
        <strong>
            ${formatMoney(totals.grandTotal)}
        </strong>

    `;

}


// ==========================================================
// Excel 匯出
// ==========================================================

async function exportQuoteToExcel() {

    if (
        currentItems.length === 0
    ) {

        alert(
            '請先加入報價項目！'
        );

        return;
    }


    const clientName =
        document.getElementById(
            'clientName'
        ).value || '';


    const projectLocation =
        document.getElementById(
            'projectLocation'
        ).value || '';


    const contractNo =
        document.getElementById(
            'contractNo'
        ).value || '';


    const quoteDateInput =
        document.getElementById(
            'quoteDate'
        ).value || '';


    // ======================================================
    // 日期
    // ======================================================

    let dateStr =
        quoteDateInput;


    if (quoteDateInput) {

        const d =
            new Date(
                quoteDateInput
            );


        const rocYear =
            d.getFullYear() -
            1911;


        const m =
            String(
                d.getMonth() + 1
            ).padStart(
                2,
                '0'
            );


        const day =
            String(
                d.getDate()
            ).padStart(
                2,
                '0'
            );


        dateStr =
            `${rocYear} 年 ${m}月${day}日`;

    }


    try {

        // ==================================================
        // 讀取範本
        // ==================================================

        const response =
            await fetch(
                './template.xlsx',
                {
                    cache: 'no-store'
                }
            );


        if (!response.ok) {

            alert(
                '找不到 template.xlsx，請確認它與 HTML 放在同一個資料夾。'
            );

            return;
        }


        const arrayBuffer =
            await response.arrayBuffer();


        const wb =
            new ExcelJS.Workbook();


        await wb.xlsx.load(
            arrayBuffer
        );


        // ==================================================
        // 工作表
        // ==================================================

        const ws =
            wb.getWorksheet(
                '估價單0906'
            ) ||
            wb.worksheets[0];


        if (!ws) {

            alert(
                '找不到報價單工作表！'
            );

            return;
        }


        // ==================================================
        // 第一頁
        //
        // 不動目前第一頁設定
        // ==================================================

        ws.getCell(
            'A6'
        ).value =
            `客戶名稱 :${clientName}`;


        ws.getCell(
            'G6'
        ).value =
            contractNo;


        ws.getCell(
            'A7'
        ).value =
            `工程地點 :${projectLocation}`;


        if (dateStr) {

            ws.getCell(
                'G7'
            ).value =
                dateStr;

        }


        // ==================================================
        // 清除第二頁
        // ==================================================

        for (
            let r = 48;
            r <= 150;
            r++
        ) {

            for (
                let c = 1;
                c <= 7;
                c++
            ) {

                ws.getCell(
                    r,
                    c
                ).value = null;

            }

        }


        // ==================================================
        // 分頁
        // ==================================================

        ws.pageSetup.printArea =
            'A1:G150';


        ws.pageSetup.fitToPage =
            true;


        ws.pageSetup.fitToWidth =
            1;


        ws.pageSetup.fitToHeight =
            0;


        ws.pageSetup.orientation =
            'portrait';


        ws.pageSetup.paperSize =
            9;


        if (
            ws.rowBreaks &&
            Array.isArray(
                ws.rowBreaks.brk
            )
        ) {

            ws.rowBreaks.brk = [];

        }


        if (
            typeof ws.addRowBreak ===
            'function'
        ) {

            ws.addRowBreak(
                47
            );

        }


        // ==================================================
        // 分類
        // ==================================================

        const grouped = {};


        currentItems.forEach(
            item => {

                if (
                    !grouped[
                        item.category
                    ]
                ) {

                    grouped[
                        item.category
                    ] = [];

                }


                grouped[
                    item.category
                ].push(item);

            }
        );


        // ==================================================
        // 工種順序
        // ==================================================

        const catOrderList = [

            '水電工程',

            '燈具工程',

            '木作工程',

            '油漆工程',

            '雜項工程'

        ];


        const numMap = [

            '一',
            '二',
            '三',
            '四',
            '五',
            '六',
            '七',
            '八'

        ];


        // ==================================================
        // 第一頁總表位置
        // ==================================================

        const mainRowMap = {

            '水電工程': 11,

            '燈具工程': 12,

            '木作工程': 13,

            '油漆工程': 14,

            '雜項工程': 15

        };


        let curRow = 49;

        let activeIdx = 0;

        const categoryTotals = {};


        // ==================================================
        // 第二頁字體
        // ==================================================

        function setSecondPageFont(
            cell,
            bold
        ) {

            cell.font = {

                name:
                    'Microsoft JhengHei',

                size: 12,

                bold: bold,

                italic: false,

                underline: false

            };

        }


        // ==================================================
        // 第二頁靠左
        //
        // 注意：
        // 不沿用範本 alignment
        // 直接覆蓋
        // ==================================================

        function alignLeft(
            cell
        ) {

            cell.alignment = {

                horizontal: 'left',

                vertical: 'center',

                wrapText: false

            };

        }


        // ==================================================
        // 第二頁置中
        // ==================================================

        function alignCenter(
            cell
        ) {

            cell.alignment = {

                horizontal: 'center',

                vertical: 'center',

                wrapText: false

            };

        }


        // ==================================================
        // 第二頁數字靠右
        // ==================================================

        function alignRight(
            cell
        ) {

            cell.alignment = {

                horizontal: 'right',

                vertical: 'center',

                wrapText: false

            };

        }


        // ==================================================
        // 建立第二頁
        // ==================================================

        catOrderList.forEach(
            cat => {

                const items =
                    grouped[cat] || [];


                const mainRow =
                    mainRowMap[cat];


                // ==========================================
                // 沒有資料
                // ==========================================

                if (
                    items.length === 0
                ) {

                    ws.getCell(
                        `A${mainRow}`
                    ).value = null;

                    ws.getCell(
                        `B${mainRow}`
                    ).value = null;

                    ws.getCell(
                        `C${mainRow}`
                    ).value = null;

                    ws.getCell(
                        `D${mainRow}`
                    ).value = null;

                    ws.getCell(
                        `E${mainRow}`
                    ).value = null;

                    ws.getCell(
                        `F${mainRow}`
                    ).value = null;

                    return;

                }


                const numStr =
                    numMap[
                        activeIdx
                    ] ||
                    String(
                        activeIdx + 1
                    );


                activeIdx++;


                // ==========================================
                // 第一頁總表
                // ==========================================

                ws.getCell(
                    `A${mainRow}`
                ).value =
                    numStr;


                ws.getCell(
                    `B${mainRow}`
                ).value =
                    cat;


                ws.getCell(
                    `C${mainRow}`
                ).value =
                    1;


                ws.getCell(
                    `D${mainRow}`
                ).value =
                    '式';


                // ==========================================
                // 第二頁
                //
                // 一、水電工程
                //
                // 粗體
                // 左對齊
                // ==========================================

                const headerA =
                    ws.getCell(
                        `A${curRow}`
                    );

                const headerB =
                    ws.getCell(
                        `B${curRow}`
                    );


                headerA.value =
                    numStr;


                headerB.value =
                    cat;


                for (
                    let c = 1;
                    c <= 7;
                    c++
                ) {

                    const cell =
                        ws.getCell(
                            curRow,
                            c
                        );


                    setSecondPageFont(
                        cell,
                        true
                    );


                    alignLeft(
                        cell
                    );

                }


                curRow++;


                // ==========================================
                // 細項
                //
                // 全部正常字體
                // 全部靠左
                // ==========================================

                items.forEach(
                    item => {

                        const cellA =
                            ws.getCell(
                                `A${curRow}`
                            );

                        const cellB =
                            ws.getCell(
                                `B${curRow}`
                            );

                        const cellC =
                            ws.getCell(
                                `C${curRow}`
                            );

                        const cellD =
                            ws.getCell(
                                `D${curRow}`
                            );

                        const cellE =
                            ws.getCell(
                                `E${curRow}`
                            );

                        const cellF =
                            ws.getCell(
                                `F${curRow}`
                            );

                        const cellG =
                            ws.getCell(
                                `G${curRow}`
                            );


                        cellA.value =
                            null;


                        cellB.value =
                            item.name;


                        cellC.value =
                            Number(
                                item.qty
                            );


                        cellD.value =
                            item.unit;


                        cellE.value =
                            Number(
                                item.price
                            );


                        cellE.numFmt =
                            '#,##0';


                        cellF.value =
                            Number(
                                item.priceSubtotal
                            );


                        cellF.numFmt =
                            '#,##0';


                        // G 永遠空白
                        cellG.value =
                            null;


                        // ----------------------------------
                        // 所有細項直接重新指定格式
                        // ----------------------------------

                        for (
                            let c = 1;
                            c <= 7;
                            c++
                        ) {

                            const cell =
                                ws.getCell(
                                    curRow,
                                    c
                                );


                            setSecondPageFont(
                                cell,
                                false
                            );


                            // 全部先靠左
                            alignLeft(
                                cell
                            );

                        }


                        curRow++;

                    }
                );


                // ==========================================
                // 工程小計
                //
                // 只有「文字」置中
                // 金額靠右
                // ==========================================

                const subtotalA =
                    ws.getCell(
                        `A${curRow}`
                    );

                const subtotalB =
                    ws.getCell(
                        `B${curRow}`
                    );

                const subtotalC =
                    ws.getCell(
                        `C${curRow}`
                    );

                const subtotalD =
                    ws.getCell(
                        `D${curRow}`
                    );

                const subtotalE =
                    ws.getCell(
                        `E${curRow}`
                    );

                const subtotalF =
                    ws.getCell(
                        `F${curRow}`
                    );

                const subtotalG =
                    ws.getCell(
                        `G${curRow}`
                    );


                subtotalA.value =
                    null;


                subtotalB.value =
                    `${cat}小計`;


                subtotalC.value =
                    null;


                subtotalD.value =
                    null;


                subtotalE.value =
                    null;


                subtotalF.value =
                    catSum;


                subtotalF.numFmt =
                    '#,##0';


                subtotalG.value =
                    null;


                // ------------------------------------------
                // 小計列全部正常字體
                // ------------------------------------------

                for (
                    let c = 1;
                    c <= 7;
                    c++
                ) {

                    const cell =
                        ws.getCell(
                            curRow,
                            c
                        );


                    setSecondPageFont(
                        cell,
                        false
                    );

                }


                // ------------------------------------------
                // 小計文字
                // B 欄置中
                // ------------------------------------------

                alignCenter(
                    subtotalB
                );


                // ------------------------------------------
                // 小計金額
                // F 欄靠右
                // ------------------------------------------

                alignRight(
                    subtotalF
                );


                // ------------------------------------------
                // 其他空白欄位靠左
                // ------------------------------------------

                alignLeft(
                    subtotalA
                );

                alignLeft(
                    subtotalC
                );

                alignLeft(
                    subtotalD
                );

                alignLeft(
                    subtotalE
                );

                alignLeft(
                    subtotalG
                );


                categoryTotals[cat] =
                    catSum;


                // ==========================================
                // 小計後空一整列
                // ==========================================

                curRow++;

                curRow++;

            }
        );


        // ==================================================
        // 第一頁總表金額
        // ==================================================

        function fillTotalCell(
            cellRef,
            value
        ) {

            const cell =
                ws.getCell(
                    cellRef
                );


            if (
                value !== undefined &&
                value !== null &&
                Number(value) > 0
            ) {

                cell.value =
                    Number(value);

                cell.numFmt =
                    '#,##0';

            } else {

                cell.value =
                    null;

            }

        }


        fillTotalCell(
            'E11',
            categoryTotals[
                '水電工程'
            ]
        );

        fillTotalCell(
            'F11',
            categoryTotals[
                '水電工程'
            ]
        );


        fillTotalCell(
            'E12',
            categoryTotals[
                '燈具工程'
            ]
        );

        fillTotalCell(
            'F12',
            categoryTotals[
                '燈具工程'
            ]
        );


        fillTotalCell(
            'E13',
            categoryTotals[
                '木作工程'
            ]
        );

        fillTotalCell(
            'F13',
            categoryTotals[
                '木作工程'
            ]
        );


        fillTotalCell(
            'E14',
            categoryTotals[
                '油漆工程'
            ]
        );

        fillTotalCell(
            'F14',
            categoryTotals[
                '油漆工程'
            ]
        );


        fillTotalCell(
            'E15',
            categoryTotals[
                '雜項工程'
            ]
        );

        fillTotalCell(
            'F15',
            categoryTotals[
                '雜項工程'
            ]
        );


        // ==================================================
        // 總計
        // ==================================================

        const totals =
            calculateTotals();


        fillTotalCell(
            'E17',
            totals.managementFee
        );


        fillTotalCell(
            'F18',
            totals.subtotal +
            totals.managementFee
        );


        fillTotalCell(
            'E19',
            totals.tax
        );


        fillTotalCell(
            'F20',
            totals.grandTotal
        );


        // ==================================================
        // 付款
        // ==================================================

        const p1 =
            Math.round(
                totals.grandTotal *
                0.3
            );


        const p2 =
            Math.round(
                totals.grandTotal *
                0.3
            );


        const p3 =
            Math.round(
                totals.grandTotal *
                0.3
            );


        const p4 =
            totals.grandTotal -
            p1 -
            p2 -
            p3;


        fillTotalCell(
            'F22',
            p1
        );

        fillTotalCell(
            'F23',
            p2
        );

        fillTotalCell(
            'F24',
            p3
        );

        fillTotalCell(
            'F25',
            p4
        );


        // ==================================================
        // G 欄全部清空
        // ==================================================

        for (
            let r = 48;
            r <= 150;
            r++
        ) {

            ws.getCell(
                `G${r}`
            ).value =
                null;

        }


        // ==================================================
        // 匯出
        // ==================================================

        const buffer =
            await wb.xlsx.writeBuffer();


        const fileName =
            clientName

                ? `裝修報價單-${clientName}-${quoteDateInput}.xlsx`

                : `裝修報價單-${quoteDateInput}.xlsx`;


        saveAs(

            new Blob(
                [buffer],
                {
                    type:
                        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                }
            ),

            fileName

        );


    } catch (err) {

        console.error(
            'Excel 匯出錯誤：',
            err
        );


        alert(
            '套印匯出發生錯誤：' +
            err.message
        );

    }

}

</script>
