<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>室內裝修報價與工程進度管理系統 - 表格可編輯與單價庫版</title>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f3f4f6;
    font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;
    color: #222;
}

.container {
    max-width: 1400px;
    margin: auto;
}

h1 {
    margin: 0 0 20px;
    font-size: 28px;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.card h2 {
    margin-top: 0;
    font-size: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.field label {
    font-weight: bold;
}

input,
select,
textarea,
button {
    font-family: inherit;
}

input,
select,
textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 70px;
    resize: vertical;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    opacity: .85;
}

.btn {
    background: #333;
    color: white;
}

.btn-green {
    background: #238636;
    color: white;
}

.btn-blue {
    background: #2563eb;
    color: white;
}

.btn-red {
    background: #dc2626;
    color: white;
}

.btn-gray {
    background: #e5e7eb;
    color: #222;
}

.button-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.quote-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

.quote-table th,
.quote-table td {
    border: 1px solid #ddd;
    padding: 6px;
    vertical-align: middle;
}

.quote-table th {
    background: #f0f0f0;
}

.quote-table input[type="text"],
.quote-table input[type="number"],
.quote-table select {
    padding: 6px 8px;
    font-size: 14px;
}

.right {
    text-align: right;
}

.center {
    text-align: center;
}

.summary {
    display: flex;
    justify-content: flex-end;
}

.summary-box {
    width: 400px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #ddd;
}

.summary-row.total {
    font-size: 20px;
    font-weight: bold;
}

.checkbox-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.checkbox-row label {
    display: flex;
    align-items: center;
    gap: 5px;
}

.checkbox-row input {
    width: auto;
}

.test-panel {
    display: none;
    background: #fff7ed;
    border: 1px solid #fdba74;
}

.test-panel.show {
    display: block;
}

.notice {
    padding: 12px;
    border-radius: 8px;
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    margin-top: 10px;
}

.edit-hint {
    background: #fef3c7;
    border: 1px solid #fde047;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-weight: bold;
    color: #854d0e;
}

.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-overlay.show {
    display: flex;
}

.modal-content {
    background: white;
    padding: 24px;
    border-radius: 12px;
    width: 90%;
    max-width: 800px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.price-db-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

.price-db-table th, .price-db-table td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
}

.price-db-table th {
    background: #f8fafc;
}

@media (max-width: 900px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }
    .grid {
        grid-template-columns: 1fr;
    }
    .summary-box {
        width: 100%;
    }
}

</style>

</head>


<body>

<div class="container">

<h1>
    室內裝修報價與工程進度管理系統 <span style="font-size: 18px; color: #2563eb;">(單價庫/可編輯版)</span>
</h1>


<!-- 功能按鈕 -->
<div class="card">
    <div class="button-row">
        <button class="btn-gray" onclick="toggleTestPage()">測試資料</button>
        <button class="btn-blue" onclick="saveDraft()">儲存草稿</button>
        <button class="btn-gray" onclick="loadDraft()">載入草稿</button>
        <button class="btn-red" onclick="clearAllItemsData()">清除報價</button>
    </div>
</div>


<!-- 測試資料面板 -->
<div id="testPanel" class="card test-panel">
    <h2>測試資料</h2>
    <div class="button-row">
        <button class="btn-blue" onclick="loadTestData()">載入測試資料</button>
        <button class="btn-red" onclick="clearAllItemsData()">清除全部</button>
    </div>
    <div id="testMonitor" class="notice">目前尚無資料</div>
</div>


<!-- 基本資料 -->
<div class="card">
    <h2>基本資料</h2>
    <div class="grid">
        <div class="field">
            <label>客戶名稱</label>
            <input id="clientName" type="text">
        </div>
        <div class="field">
            <label>工程地點</label>
            <input id="projectLocation" type="text">
        </div>
        <div class="field">
            <label>合約編號</label>
            <input id="contractNo" type="text">
        </div>
        <div class="field">
            <label>報價日期</label>
            <input id="quoteDate" type="date">
        </div>
        <div class="field">
            <label>預估工期 (工作天)</label>
            <input id="estimatedDays" type="number" min="1" placeholder="例如：45" onchange="renderSchedule()">
        </div>
        <div class="field">
            <label>設計師</label>
            <input id="designerName" type="text">
        </div>
    </div>
</div>


<!-- 新增報價 -->
<div class="card">
    <h2>
        <span>新增報價項目</span>
        <button class="btn-gray" style="font-size: 13px; font-weight: normal;" onclick="openPriceDbModal()">⚙️ 管理單價庫項目</button>
    </h2>
    <div class="grid">
        <div class="field">
            <label>工程分類</label>
            <select id="categorySelect" onchange="onCategoryChange()">
                <option value="">請選擇</option>
                <option value="水電工程">水電工程</option>
                <option value="燈具工程">燈具工程</option>
                <option value="木作工程">木作工程</option>
                <option value="油漆工程">油漆工程</option>
                <option value="雜項工程">雜項工程</option>
                <option value="保護工程">保護工程</option>
                <option value="拆除工程">拆除工程</option>
                <option value="木地板工程">木地板工程</option>
            </select>
        </div>

        <div class="field">
            <label>工程項目</label>
            <select id="itemPresetSelect" onchange="onItemPresetChange()">
                <option value="">請先選擇工種</option>
            </select>
            <input id="subCategorySelect" type="text" style="display: none; margin-top: 5px;" placeholder="請輸入自訂項目名稱">
        </div>

        <div class="field">
            <label>數量</label>
            <input id="itemQty" type="number" step="0.01" value="1">
        </div>

        <div class="field">
            <label>單位</label>
            <input id="itemUnit" type="text" value="式">
        </div>

        <div class="field">
            <label>成本單價</label>
            <input id="costPrice" type="number" step="1">
        </div>

        <div class="field">
            <label>報價單價</label>
            <input id="quotePrice" type="number" step="1">
        </div>

        <div class="field" style="grid-column: span 2;">
            <label>備註</label>
            <input id="itemNote" type="text">
        </div>
    </div>

    <div class="button-row">
        <button class="btn-green" onclick="addItem()">加入報價</button>
    </div>
</div>


<!-- 報價明細 -->
<div class="card">
    <h2>報價明細</h2>
    
    <div class="edit-hint">
        💡 提示：您可以直接在下方表格中修改工種、項目名稱、數量或單價，系統會自動更新複價與總價！
    </div>
